services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/venv 
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8000","http://127.0.0.1:8000","https://borderstem.com","https://www.borderstem.com"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Evita que los node_modules locales interfieran
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend