services:
  postgres:
    image: postgres:15-alpine
    container_name: stem-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"  # Expuesto para que conectarse mediante pgadmin o alguna herramienta a fin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stem-net

  stem-backend:
    container_name: stem-backend
    build:
      context: ./backend
      dockerfile: DockerFile 
    # En producción no exponemos el puerto 8000 al mundo exterior. 
    #expose:
     # - "8000"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
    # queda pendiente el dominio
      CORS_ORIGINS: '["http://localhost", "https://tudominio.com"]'
      ENVIRONMENT: "production"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - stem-net

volumes:
  posgres-data:
  
networks:
  stem-net:
    driver: bridge