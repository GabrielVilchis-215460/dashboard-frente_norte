services:
  postgres:
    image: postgres:15-alpine
    container_name: stem-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Puerto 5432 NO expuesto al host — acceso solo interno vía stem-net.
    # Para pgAdmin: conectar al contenedor con: docker exec -it stem-postgres psql -U root stem_db
    # O usar un túnel SSH: ssh -L 5432:localhost:5432 usuario@servidor
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/app/db/backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stem-net

  stem-backend:
    container_name: stem-backend
    build:
      context: ./backend
      dockerfile: DockerFile
    # Puerto 8000 solo accesible internamente vía Nginx — no expuesto al host.
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: '["https://borderstem.com", "https://www.borderstem.com"]'
      ENVIRONMENT: "production"
    volumes:
      - imagenes-data:/app/imagenes
    #healthcheck:
     # test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      #interval: 15s
      #timeout: 5s
      #retries: 3
      #start_period: 20s
    restart: always
    networks:
      - stem-net

  nginx:
    image: nginx:alpine
    container_name: stem-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - imagenes-data:/var/www/imagenes
    depends_on:
      - stem-backend
    networks:
      - stem-net

  certbot:
    image: certbot/certbot
    container_name: stem-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - stem-net

volumes:
  postgres-data:
  imagenes-data:

networks:
  stem-net:
    driver: bridge