server {
    listen 80;
    server_name borderstem.com www.borderstem.com;

    # Redirigir todo HTTP a HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name borderstem.com www.borderstem.com;

    ssl_certificate     /etc/letsencrypt/live/borderstem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borderstem.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de seguridad
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin"        always;
    add_header Strict-Transport-Security "max-age=31536000"     always;

    # Imágenes subidas manualmente (backend las guarda en este volumen)
    location /imagenes/ {
        alias /var/www/imagenes/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # API backend
    location /api/ {
        proxy_pass         http://stem-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10M;
    }

    # Swagger / ReDoc (solo en desarrollo — comentar en prod si se desea)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass       http://stem-backend:8000;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass       http://stem-backend:8000/health;
        proxy_set_header Host $host;
    }

    # Frontend (React SPA)
    location / {
        proxy_pass         http://stem-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
